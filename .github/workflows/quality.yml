name: Quality

on:
  pull_request:
    branches: [development, qa, staging, prod]
  push:
    branches: [development, qa, staging, prod]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:8.0.19
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned package manager
        run: npm install --global pnpm@12.11.2 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format, lint, type check, test, and build
        run: pnpm check
      - name: Shopify session and HTTP integration tests
        run: pnpm test:admin:db
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017
      - name: Verify generated API documentation
        run: |
          pnpm api:spec
          git diff --exit-code -- docs/api/openapi.json
      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate
