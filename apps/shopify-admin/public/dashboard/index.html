<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Checkout OS</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <style>
      :root {
        --bg: #f8fafc;
        --card: #fff;
        --tx: #111827;
        --tx2: #64748b;
        --ac: #4f46e5;
        --ok: #16a34a;
        --wa: #f59e0b;
        --er: #dc2626;
        --bd: #e2e8f0;
        --hv: #f1f5f9;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0b1020;
          --card: #131a2e;
          --tx: #e5e7eb;
          --tx2: #94a3b8;
          --bd: #243049;
          --hv: #1a2340;
          --ac: #818cf8;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0b1020;
        --card: #131a2e;
        --tx: #e5e7eb;
        --tx2: #94a3b8;
        --bd: #243049;
        --hv: #1a2340;
        --ac: #818cf8;
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          13px/1.45 'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 1px;
      }
      #app {
        display: flex;
        min-height: 100vh;
      }
      aside {
        width: 240px;
        background: var(--card);
        border-right: 1px solid var(--bd);
        padding: 10px 8px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        flex: none;
        transition: width 0.18s;
      }
      aside.c {
        width: 64px;
      }
      aside.c .lb,
      aside.c h6,
      aside.c .bdg {
        display: none;
      }
      .logo {
        font-weight: 700;
        font-size: 15px;
        padding: 6px 8px 10px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .logo i {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--ac);
        display: inline-block;
        flex: none;
      }
      aside h6 {
        margin: 12px 8px 4px;
        font-size: 11px;
        font-weight: 600;
        color: var(--tx2);
        cursor: pointer;
      }
      .nv {
        display: flex;
        gap: 8px;
        align-items: center;
        width: 100%;
        border: 0;
        background: none;
        text-align: left;
        padding: 6px 8px;
        border-radius: 6px;
        color: var(--tx2);
      }
      .nv:hover {
        background: var(--hv);
      }
      .nv.on {
        background: var(--hv);
        color: var(--ac);
        font-weight: 600;
      }
      .nv .ic {
        width: 16px;
        text-align: center;
        flex: none;
      }
      .bdg {
        margin-left: auto;
        background: var(--er);
        color: #fff;
        border-radius: 9px;
        padding: 0 6px;
        font-size: 11px;
      }
      main {
        flex: 1;
        min-width: 0;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 8px 16px;
        background: var(--card);
        border-bottom: 1px solid var(--bd);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      header select,
      header input,
      .btn {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 6px;
        padding: 5px 8px;
      }
      .btn:hover {
        background: var(--hv);
      }
      .btn.p {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      .btn.s {
        padding: 2px 8px;
        font-size: 12px;
      }
      .sp {
        flex: 1;
      }
      .pill {
        border-radius: 10px;
        padding: 1px 8px;
        font-size: 11px;
        font-weight: 600;
        background: var(--hv);
        white-space: nowrap;
      }
      .ok {
        color: var(--ok);
      }
      .wa {
        color: var(--wa);
      }
      .er {
        color: var(--er);
      }
      .mu {
        color: var(--tx2);
      }
      .env {
        background: #fef3c7;
        color: #92400e;
      }
      .env.pr {
        background: #dcfce7;
        color: #166534;
      }
      section.pg {
        padding: 14px 16px;
        max-width: 1500px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 2px;
      }
      .sub {
        color: var(--tx2);
        margin-bottom: 12px;
      }
      .g {
        display: grid;
        gap: 10px;
        margin-bottom: 10px;
      }
      .g4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .g2 {
        grid-template-columns: 2fr 1fr;
      }
      .g3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .e2 {
        grid-template-columns: 1fr 1fr;
      }
      .cd {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 10px 12px;
        min-width: 0;
      }
      .cd h3 {
        margin: 0 0 6px;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .kv {
        font-size: 20px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .kl {
        color: var(--tx2);
        font-size: 12px;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        padding: 6px 8px;
        border-bottom: 1px solid var(--bd);
        text-align: left;
        white-space: nowrap;
      }
      th {
        color: var(--tx2);
        font-weight: 600;
        cursor: pointer;
        user-select: none;
      }
      tbody tr:hover {
        background: var(--hv);
        cursor: pointer;
      }
      .tb {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tb input,
      .tb select {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 6px;
        padding: 5px 8px;
      }
      #dr {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(440px, 100%);
        background: var(--card);
        border-left: 1px solid var(--bd);
        padding: 14px;
        overflow: auto;
        transform: translateX(100%);
        transition: transform 0.18s;
        z-index: 20;
      }
      #dr.o {
        transform: none;
      }
      pre {
        background: var(--hv);
        padding: 8px;
        border-radius: 6px;
        overflow: auto;
        font-size: 12px;
      }
      .k {
        color: var(--ac);
      }
      .sv {
        color: var(--ok);
      }
      .nm {
        color: var(--wa);
      }
      #ts {
        position: fixed;
        bottom: 16px;
        right: 16px;
        display: grid;
        gap: 6px;
        z-index: 30;
      }
      .t {
        background: var(--tx);
        color: var(--bg);
        padding: 8px 12px;
        border-radius: 6px;
      }
      .feed {
        max-height: 420px;
        overflow: auto;
      }
      .feed div {
        padding: 4px 0;
        border-bottom: 1px solid var(--bd);
      }
      .ig {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 10px;
      }
      .mn {
        display: none;
      }
      @media (max-width: 900px) {
        aside {
          position: fixed;
          z-index: 15;
          left: 0;
          transform: translateX(-100%);
        }
        aside.m {
          transform: none;
        }
        .mn {
          display: inline-block;
        }
        .g4 {
          grid-template-columns: 1fr 1fr;
        }
        .g2,
        .g3,
        .e2 {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 480px) {
        .g4 {
          grid-template-columns: 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
      body {
        font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
        font-size: 13px;
        letter-spacing: -0.005em;
      }
      .sf label {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin: 8px 0;
        cursor: pointer;
      }
      .sf .fld {
        display: grid;
        gap: 4px;
        margin: 10px 0;
      }
      .sf .fld input,
      .sf .fld select {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 6px;
        padding: 6px 8px;
        width: 100%;
        max-width: 420px;
      }
      .sf .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .sf .banner {
        padding: 8px 10px;
        border-radius: 6px;
        background: var(--hv);
        margin-bottom: 10px;
      }
      :root {
        --bg: #f4f5fa;
        --bd: #e6e8f2;
        --sh: 0 1px 2px rgba(16, 24, 64, 0.05), 0 4px 14px rgba(16, 24, 64, 0.04);
        --ink: #0e1124;
        --tl: #0ea5a4;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0a0d1c;
          --card: #12162b;
          --bd: #222845;
          --sh: none;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0a0d1c;
        --card: #12162b;
        --bd: #222845;
        --sh: none;
      }
      aside {
        background: var(--ink);
        border-right: 0;
        color: #a5adcb;
      }
      aside h6 {
        color: #6b7399;
        letter-spacing: 0.01em;
        font-weight: 600;
      }
      .nv {
        color: #a5adcb;
        border-radius: 8px;
        position: relative;
      }
      .nv:hover {
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
      }
      .nv.on {
        background: rgba(129, 140, 248, 0.16);
        color: #fff;
      }
      .nv.on:before {
        content: '';
        position: absolute;
        left: -8px;
        top: 7px;
        bottom: 7px;
        width: 3px;
        border-radius: 2px;
        background: #818cf8;
      }
      .logo {
        color: #fff;
      }
      .logo i {
        background: conic-gradient(from 200deg, #818cf8, #0ea5a4, #818cf8);
      }
      header {
        background: color-mix(in srgb, var(--card) 88%, transparent);
        backdrop-filter: blur(8px);
        border-bottom-color: var(--bd);
      }
      .cd {
        border-radius: 14px;
        box-shadow: var(--sh);
        padding: 14px 16px;
      }
      .cd h3 {
        font-size: 13.5px;
        font-weight: 700;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .kv {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .btn,
      header select,
      header input,
      .tb input {
        border-radius: 8px;
      }
      .btn.p {
        background: var(--ac);
      }
      th {
        font-size: 11.5px;
        font-weight: 600;
        background: var(--hv);
      }
      th:first-child {
        border-radius: 8px 0 0 8px;
      }
      th:last-child {
        border-radius: 0 8px 8px 0;
      }
      th,
      td {
        border-bottom-color: var(--bd);
        padding: 8px 10px;
      }
      .pill {
        border-radius: 20px;
        padding: 2px 9px;
      }
      .pill.ok {
        background: rgba(22, 163, 74, 0.12);
      }
      .pill.er {
        background: rgba(220, 38, 38, 0.12);
      }
      .pill.wa {
        background: rgba(245, 158, 11, 0.16);
      }
      .hero {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 14px;
        background: var(--ink);
        color: #e5e7eb;
        border-radius: 18px;
        padding: 18px 20px;
        margin-bottom: 12px;
        box-shadow: 0 10px 30px rgba(14, 17, 36, 0.25);
      }
      .hero .kl {
        color: #8e96bc;
      }
      .hero b.big {
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #fff;
      }
      .lk {
        display: grid;
        grid-template-columns: 130px 1fr 80px;
        gap: 8px;
        align-items: center;
        margin: 7px 0;
        font-size: 12.5px;
      }
      .lk i {
        display: block;
        height: 8px;
        border-radius: 4px;
      }
      .uk {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }
      .uk .cd {
        border-top: 3px solid var(--c, var(--ac));
      }
      .uk .why {
        color: var(--tx2);
        font-size: 11.5px;
        margin-top: 4px;
      }
      .nw {
        font-size: 10.5px;
        background: var(--tl);
        color: #fff;
        border-radius: 4px;
        padding: 0 5px;
        margin-left: 6px;
        font-weight: 700;
      }
      .fl {
        display: flex;
        gap: 0;
        overflow-x: auto;
        padding: 6px 0;
      }
      .fl div {
        min-width: 130px;
        padding: 8px 10px;
        border: 1px solid var(--bd);
        border-left: 0;
        background: var(--hv);
      }
      .fl div:first-child {
        border-left: 1px solid var(--bd);
        border-radius: 10px 0 0 10px;
      }
      .fl div:last-child {
        border-radius: 0 10px 10px 0;
      }
      .fl .bad {
        background: rgba(220, 38, 38, 0.12);
        border-color: var(--er);
      }
      @media (max-width: 900px) {
        .hero {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sb"></aside>
      <main>
        <header id="tp"></header>
        <section class="pg" id="pg"></section>
      </main>
    </div>
    <div id="dr"></div>
    <div id="ts" role="status"></div>
    <script>
      // ---------- seeded demo data (deterministic) ----------
      let sd = 20261017;
      const R = () => {
        sd |= 0;
        sd = (sd + 0x6d2b79f5) | 0;
        let t = Math.imul(sd ^ (sd >>> 15), 1 | sd);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const pick = (a) => a[Math.floor(R() * a.length)],
        wpick = (o) => {
          let r = R(),
            s = 0;
          for (const k in o) {
            s += o[k];
            if (r < s) return k;
          }
          return Object.keys(o)[0];
        };
      const MER = [
        'Kala Threads',
        'Masala Box',
        'Urban Soles',
        'Ayur Roots',
        'Nirvana Home',
        'Bolt Gadgets',
        'Saffron & Co',
        'Pixel Paper',
      ].map((n, i) => ({
        id: 'm_' + (i + 1),
        name: n,
        shop: n.toLowerCase().replace(/[^a-z]+/g, '-') + '.myshopify.com',
        plan: ['Growth', 'Scale', 'Enterprise'][i % 3],
        tier: ['Full checkout', 'Shopify-hosted fallback', 'Full checkout'][i % 3 == 1 ? 1 : 0],
        health: i == 5 ? 'Degraded' : 'Healthy',
        size: 0.5 + R() * 1.5,
      }));
      const GW = ['Razorpay', 'Cashfree', 'PayU'],
        FAIL = [
          'UPI_TIMEOUT',
          'BANK_DECLINED',
          '3DS_FAILED',
          'INSUFFICIENT_FUNDS',
          'GATEWAY_ERROR',
        ];
      const S = [],
        O = [],
        P = [],
        W = [],
        L = [],
        A = [];
      const EV = [
        'checkout.created',
        'checkout.completed',
        'payment.succeeded',
        'payment.failed',
        'order.created',
        'order.sync_failed',
        'refund.created',
        'loyalty.redeemed',
      ];
      for (let i = 0; i < 1800; i++) {
        const m = pick(MER);
        if (R() > m.size / 2) continue;
        const day = Math.floor(R() * 30),
          hr = Math.floor(8 + R() * 15),
          type = R() < 0.35 ? 'Buy Now' : 'Cart';
        const st = wpick({
          Completed: 0.3,
          Abandoned: 0.36,
          'Payment Failed': 0.12,
          'Payment Pending': 0.05,
          Expired: 0.07,
          Active: 0.05,
          Created: 0.05,
        });
        const pm = wpick({ UPI: 0.5, Cards: 0.17, COD: 0.2, 'Net Banking': 0.06, Wallets: 0.07 }),
          val = Math.round(500 + R() * R() * 6000);
        const s = {
          id: 'cs_' + (100000 + i),
          merchant: m.id,
          mname: m.name,
          customer: '+91 9••••' + String(1000 + Math.floor(R() * 9000)).slice(1),
          type,
          value: val,
          currency: 'INR',
          method: pm,
          status: st,
          device: wpick({ Mobile: 0.72, Desktop: 0.25, Tablet: 0.03 }),
          day,
          hr,
          created: `D-${day} ${hr}:${String(Math.floor(R() * 60)).padStart(2, '0')}`,
          load: Math.round(900 + R() * R() * 3000),
        };
        S.push(s);
        if (st != 'Created' && st != 'Active' && st != 'Abandoned' && st != 'Expired') {
          const n = st == 'Completed' ? (R() < 0.15 ? 2 : 1) : 1 + (R() < 0.3);
          for (let a = 0; a < n; a++) {
            const ok = st == 'Completed' && a == n - 1,
              pn = st == 'Payment Pending' && a == n - 1;
            P.push({
              id: 'pay_' + (500000 + P.length),
              checkout: s.id,
              merchant: m.id,
              mname: m.name,
              amount: val,
              gateway: pick(GW),
              method: pm,
              status: ok ? 'Succeeded' : pn ? 'Pending' : 'Failed',
              code: ok || pn ? '—' : pick(FAIL),
              attempt: a + 1,
              day,
              hr,
              latency: Math.round(300 + R() * 900),
            });
          }
        }
        if (st == 'Completed') {
          const mism = R() < 0.03,
            cod = pm == 'COD',
            disc = R() < 0.3 ? Math.round(val * 0.1) : 0;
          const o = {
            id: 'ORD-' + (70000 + O.length),
            shopify: mism ? '— (sync failed)' : '#' + (4000 + O.length),
            checkout: s.id,
            merchant: m.id,
            mname: m.name,
            customer: s.customer,
            amount: val,
            method: pm,
            payment: mism ? 'Paid · Shopify sync failed' : cod ? 'COD pending' : 'Paid',
            fulfil: wpick({
              Unfulfilled: 0.2,
              Shipped: 0.4,
              Delivered: 0.35,
              RTO: cod ? 0.2 : 0.02,
            }),
            discount: disc,
            points: R() < 0.15 ? Math.round(R() * 500) : 0,
            risk: cod ? Math.round(10 + R() * 80) : null,
            type,
            day,
            hr,
            created: s.created,
          };
          O.push(o);
          [
            ['order.created', 1],
            ['payment.succeeded', 1],
          ].forEach(([e]) => {
            const f = R() < (m.id == 'm_6' ? 0.3 : 0.05);
            W.push({
              id: 'evt_' + (900000 + W.length),
              event: e,
              endpoint: `https://hooks.${m.shop.split('.')[0]}.in/co`,
              merchant: m.id,
              mname: m.name,
              http: f ? pick([500, 502, 0, 429]) : 200,
              attempts: f ? 1 + Math.floor(R() * 5) : 1,
              status: f ? 'Failed' : 'Delivered',
              duration: Math.round(80 + R() * 600) + 'ms',
              day,
              hr,
              payload: { event: e, order: o.id, amount: val, customer: '[redacted]' },
            });
          });
        }
      }
      for (let i = 0; i < 300; i++) {
        const lv = wpick({ Info: 0.7, Warning: 0.2, Error: 0.08, Critical: 0.02 });
        L.push({
          id: 'log_' + i,
          ts: `D-${Math.floor(R() * 3)} ${String(Math.floor(R() * 24)).padStart(2, '0')}:${String(Math.floor(R() * 60)).padStart(2, '0')}`,
          service: pick(['api', 'checkout', 'payments', 'shopify-sync', 'webhooks']),
          level: lv,
          message: pick([
            'Request completed',
            'Retry scheduled',
            'Gateway latency elevated',
            'Shopify API throttled (429)',
            'Order sync failed: inventory lock',
            'Webhook delivery timeout',
          ]),
          correlation: 'cor_' + Math.floor(R() * 1e8).toString(36),
          merchant: pick(MER).name,
        });
      }
      const SV = [
        'API servers',
        'Checkout service',
        'Payment orchestration',
        'Shopify workers',
        'Webhook processors',
        'Redis',
        'MongoDB',
        'Background queues',
      ].map((n, i) => ({
        service: n,
        status: i == 3 ? 'Degraded' : 'Healthy',
        latency: Math.round(20 + R() * 180) + 'ms',

        return `<div class="uk"><div class="cd"><div class="kl">Webhook Trust Score<span class="nw">ONLY HERE</span></div><div class="kv">${Math.round(u.first * 100)}</div><div class="why">First-try delivery weighted by payment-critical events</div></div><div class="cd" style="--c:var(--er)"><div class="kl">Dead-letter queue</div><div class="kv">${dead}</div><div class="why">5+ attempts; replay is idempotent (simulated)</div></div><div class="cd" style="--c:var(--wa)"><div class="kl">Failed deliveries</div><div class="kv">${w.filter((x) => x.status == 'Failed').length}</div><div class="why">of ${w.length} events</div></div></div>
 <div class="cd" style="margin-bottom:10px"><h3>Checkout Flight Recorder<span class="nw">ONLY HERE</span> <span class="mu">${o.id} · ${o.mname}</span></h3><div class="mu">One checkout traced from first tap to Shopify order, with the delay between each hop. Red marks where it broke.</div><div class="fl">${hops.map((h) => `<div class="${h[2] ? 'bad' : ''}"><b>${h[0]}</b><div style="border:0;background:none;padding:0;min-width:0" class="mu">${h[1]}</div></div>`).join('')}</div></div>`;
      }
      /* Live settings API — admin session only; never called from storefront checkout. */
      let liveSettings = null,
        liveSettingsErr = '';
      function getAuthQueryAndHeaders() {
        const p = new URLSearchParams(window.location.search);
        const token = p.get('token') || '';
        const shop = p.get('shop') || '';
        const q =
          token && shop
            ? `?shop=${encodeURIComponent(shop)}&token=${encodeURIComponent(token)}`
            : shop
              ? `?shop=${encodeURIComponent(shop)}`
              : '';
        const h = {};
        if (token) h['x-dashboard-token'] = token;
        return { q, h };
      }
      async function fetchLiveSettings() {
        try {
          const { q, h } = getAuthQueryAndHeaders();
          const r = await fetch('/api/settings' + q, {
            credentials: 'same-origin',
            headers: { accept: 'application/json', ...h },
          });
          if (r.status === 401 || r.status === 302) {
            liveSettingsErr =
              'Open this dashboard from Shopify Admin (App → Checkout OS) so your session can load.';
            liveSettings = null;
            return null;
          }
          if (!r.ok) {
            liveSettingsErr = 'Could not load settings (' + r.status + ').';
            liveSettings = null;
            return null;
          }
          liveSettings = await r.json();
          liveSettingsErr = '';
          return liveSettings;
        } catch (e) {
          liveSettingsErr = 'Network error loading settings.';
          liveSettings = null;
          return null;
        }
      }
      function payBlock(p) {
        p = p || { cod: true, upi: false, card: false, netbanking: false };
        return `<div class="cd sf"><h3>Storefront payment methods</h3>
  <div class="mu">Enabled methods appear in checkout. Bro Pay is removed. Only COD places a real Shopify order today; prepaid UI is demo until gateway work lands. Flags ride the existing /v1/settings payload — no extra shopper requests.</div>
  <label><input type="checkbox" data-ec-pay="cod" ${p.cod !== false ? 'checked' : ''}/> Cash on Delivery</label>
  <label><input type="checkbox" data-ec-pay="upi" ${p.upi === true ? 'checked' : ''}/> UPI</label>
  <label><input type="checkbox" data-ec-pay="card" ${p.card === true ? 'checked' : ''}/> Cards</label>
  <label><input type="checkbox" data-ec-pay="netbanking" ${p.netbanking === true ? 'checked' : ''}/> Net banking</label>
  <div class="row"><button type="button" class="btn p" data-ec-save-pays>Save payment methods</button></div></div>`;
      }
      function settingsLive() {
        const s = liveSettings,
          b = s ? '' : `<div class="banner">${liveSettingsErr || 'Loading live settings…'}</div>`;
        if (!s)
          return `<h1>Settings</h1><div class="sub">Live checkout configuration for the connected Shopify store</div>${b}<div class="cd"><button class="btn p" data-ec-reload>Retry load</button></div>`;
        const p = s.payments || {};
        return `<h1>Settings</h1><div class="sub">Live · shop <b>${s.shop || '—'}</b> · saves to Mongo checkoutSettings</div>
  <div class="g e2">
  <div class="cd sf"><h3>Branding</h3>
    <div class="fld"><span class="kl">Center display</span>
      <label><input type="radio" name="brandMode" value="name" ${s.brandMode !== 'logo' ? 'checked' : ''}/> Brand name</label>
      <label><input type="radio" name="brandMode" value="logo" ${s.brandMode === 'logo' ? 'checked' : ''}/> Brand logo</label>
    </div>
    <div class="fld"><label class="kl">Brand name</label><input data-ec-f="brandName" value="${(s.brandName || '').replace(/"/g, '&quot;')}" maxlength="80"/></div>
    <div class="fld"><label class="kl">Logo URL</label><input data-ec-f="logoUrl" value="${(s.logoUrl || '').replace(/"/g, '&quot;')}" placeholder="https://…"/></div>
    <label><input type="checkbox" data-ec-f="requireCodConfirmation" ${s.requireCodConfirmation !== false ? 'checked' : ''}/> Ask for confirmation before placing COD orders</label>
    <label><input type="checkbox" data-ec-f="showUpsell" ${s.showUpsell !== false ? 'checked' : ''}/> Show “You may also like”</label>
    <label><input type="checkbox" data-ec-f="giftVouchersEnabled" ${s.giftVouchersEnabled !== false ? 'checked' : ''}/> Enable gift vouchers</label>
    <div class="fld"><label class="kl">Gift voucher verification</label>
      <select data-ec-f="giftVoucherVerifyMode"><option value="pin" ${s.giftVoucherVerifyMode !== 'otp' ? 'selected' : ''}>PIN</option><option value="otp" ${s.giftVoucherVerifyMode === 'otp' ? 'selected' : ''}>OTP</option></select>
    </div>
    <label><input type="checkbox" data-ec-f="loyaltyPartnerEnabled" ${s.loyaltyPartnerEnabled !== false ? 'checked' : ''}/> Show loyalty partner points</label>
    <div class="fld"><label class="kl">Loyalty partner name</label><input data-ec-f="loyaltyPartnerName" value="${(s.loyaltyPartnerName || '').replace(/"/g, '&quot;')}"/></div>
    <div class="fld"><label class="kl">Loyalty points balance (demo)</label><input data-ec-f="loyaltyPointsBalance" type="number" min="0" step="1" value="${Number(s.loyaltyPointsBalance) || 0}"/></div>
    <div class="row"><button type="button" class="btn p" data-ec-save-all>Save all settings</button></div>
  </div>
  ${payBlock(p)}
  </div>`;
      }
      function paymentsLive() {
        const s = liveSettings;
        if (!s)
          return `<h1>Payments</h1><div class="sub">Enable or disable methods shown on checkout</div><div class="banner">${liveSettingsErr || 'Loading…'}</div><button class="btn p" data-ec-reload>Retry load</button>`;
        return `<h1>Payments</h1><div class="sub">Live payment method flags · shop <b>${s.shop || '—'}</b></div>${payBlock(s.payments)}
  <div class="cd" style="margin-top:10px"><h3>How prepaid works (now)</h3><div class="mu">UPI / Cards / Net banking can be shown when enabled. Confirm sheets are demo only — place order still requires COD. Gateway collection comes later without changing this settings shape.</div></div>`;
      }
      function readPaymentsFromDom(root) {
        const g = (id) => !!root.querySelector(`[data-ec-pay="${id}"]`)?.checked;
        return { cod: g('cod'), upi: g('upi'), card: g('card'), netbanking: g('netbanking') };
      }
      function readAllFromDom(root) {
        const f = (k) => root.querySelector(`[data-ec-f="${k}"]`);
        const mode = root.querySelector('input[name="brandMode"]:checked')?.value || 'name';
        return {
          brandMode: mode,
          brandName: f('brandName')?.value || '',
          logoUrl: f('logoUrl')?.value || '',
          requireCodConfirmation: !!f('requireCodConfirmation')?.checked,
          showUpsell: !!f('showUpsell')?.checked,
          giftVouchersEnabled: !!f('giftVouchersEnabled')?.checked,
          giftVoucherVerifyMode: f('giftVoucherVerifyMode')?.value || 'pin',
          loyaltyPartnerEnabled: !!f('loyaltyPartnerEnabled')?.checked,
          loyaltyPartnerName: f('loyaltyPartnerName')?.value || '',
          loyaltyPointsBalance: Number(f('loyaltyPointsBalance')?.value || 0),
          payments: readPaymentsFromDom(root),
        };
      }
      async function putLiveSettings(body) {
        const { q, h } = getAuthQueryAndHeaders();
        const r = await fetch('/api/settings' + q, {
          method: 'PUT',
          credentials: 'same-origin',
          headers: { 'content-type': 'application/json', accept: 'application/json', ...h },
          body: JSON.stringify(body),
        });
        const j = await r.json().catch(() => null);
        if (!r.ok) throw new Error(j?.error?.message || 'Save failed (' + r.status + ')');
        liveSettings = j;
        liveSettingsErr = '';
        return j;
      }
      function bindLiveSettings() {
        const pg = $('#pg');
        pg.querySelector('[data-ec-reload]')?.addEventListener('click', async () => {
          await fetchLiveSettings();
          render();
        });
        pg.querySelector('[data-ec-save-pays]')?.addEventListener('click', async (ev) => {
          const btn = ev.currentTarget;
          btn.disabled = true;
          try {
            await putLiveSettings({ payments: readPaymentsFromDom(pg) });
            toast('Payment methods saved');
            render();
          } catch (e) {
            toast(e.message || 'Save failed');
          } finally {
            btn.disabled = false;
          }
        });
        pg.querySelector('[data-ec-save-all]')?.addEventListener('click', async (ev) => {
          const btn = ev.currentTarget;
          btn.disabled = true;
          try {
            await putLiveSettings(readAllFromDom(pg));
            toast('Settings saved');
            render();
          } catch (e) {
            toast(e.message || 'Save failed');
          } finally {
            btn.disabled = false;
          }
        });
      }
      function render() {
        shell();
        let h;
        if (st.page == 'overview') h = overviewNew();
        else if (st.page == 'live') h = live();
        else if (st.page == 'integrations') h = integrations();
        else if (st.page == 'settings') h = settingsLive();
        else if (st.page == 'payments') h = paymentsLive();
        else {
          const p = pageOf(st.page);
          if (p[2].length && p[2][0].merchant !== undefined && st.page != 'logs')
            p[2] = p[2].filter(
              (r) =>
                st.merchant == 'all' ||
                r.merchant == st.merchant ||
                r.merchant == MER.find((m) => m.id == st.merchant)?.name,
            );
          const extra =
            st.page == 'webhooks'
              ? `<button class="btn s" onclick="T.webhooks.q='Failed';render()">Failed queue</button><button class="btn s" onclick="T.webhooks.q='';render()">All</button>`
              : '';
          h = `<h1>${p[0]}</h1><div class="sub">Demo data · click a row for details · sensitive fields masked</div>${st.page == 'webhooks' ? whx() : ''}${table(st.page, p[1], p[2], { extra })}`;
        }
        $('#pg').innerHTML = h;
        if (st.page == 'live') lf();
        if (st.page == 'settings' || st.page == 'payments') bindLiveSettings();
        $('#pg').scrollTop = 0;
      }
      fetchLiveSettings().then(() => {
        if (st.page == 'settings' || st.page == 'payments') render();
      });
      render();
    </script>
  </body>
</html>
