<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RARE · Oversized Hoodie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/storefront/storefront.css" />
  </head>
  <body>
    <header class="sf-top">
      <p class="sf-brand">RARE</p>
      <nav class="sf-nav" aria-label="Store">
        <a href="/">Shop</a>
        <button type="button" class="sf-cart-link" id="openCart" aria-label="Open cart">
          Bag · 1
        </button>
      </nav>
    </header>
    <main class="sf-product">
      <div class="sf-media" aria-hidden="true"></div>
      <div class="sf-info">
        <p class="sf-kicker">Bestsellers</p>
        <h1>Oversized Hoodie</h1>
        <p class="sf-price">₹1,099</p>
        <p class="sf-variant">Black / XL</p>
        <p class="sf-copy">
          Soft heavyweight fleece. Checkout opens on this page — same pattern as GoKwik-style
          overlays, not a separate checkout site.
        </p>
        <div class="sf-actions">
          <button type="button" class="sf-primary" id="buyNow">Buy now</button>
          <button type="button" class="sf-secondary" id="addCheckout">Checkout</button>
        </div>
      </div>
    </main>
    <script src="/checkout/embed.js" defer></script>
    <script src="/storefront/storefront.js" defer></script>
  </body>
</html>
